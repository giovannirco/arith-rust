[package]
name = "arith"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Integer arithmetic over HTTP: four endpoints, a page, metrics, traces and logs."
license = "MIT"
repository = "https://github.com/giovannirco/arith"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
form_urlencoded = "1"
http = "1"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-http = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "http-proto", "logs", "reqwest-blocking-client", "tls-ring", "tls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.33", features = ["logs", "trace"] }
prometheus-client = "0.25"
# reqwest is pulled in by opentelemetry-otlp for OTLP/HTTP. These features give it
# TLS through rustls with the ring provider, the same provider tonic uses for gRPC.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
http-body-util = "0.1"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
tracing-opentelemetry = "0.34"
tracing-subscriber = "0.3"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
