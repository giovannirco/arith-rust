apiVersion: apps/v1
kind: Deployment
metadata:
  name: arith
  labels:
    app.kubernetes.io/name: arith
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Start the new pod before stopping the old one, so a single replica rolls
  # without a gap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arith
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arith
    spec:
      # The process never talks to the Kubernetes API.
      automountServiceAccountToken: false
      # Longer than the preStop pause (3s) plus ARITH_SHUTDOWN_TIMEOUT (10s),
      # so draining finishes before the kill.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arith
          image: ghcr.io/giovannirco/arith-rust
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ARITH_LOG_LEVEL
              value: info
            - name: ARITH_LOG_FORMAT
              value: json
          # Kubernetes drops the pod from the Service and sends SIGTERM at the
          # same moment. Pausing before the signal lets the endpoint change
          # reach every node first, so no request lands on a closed listener.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
