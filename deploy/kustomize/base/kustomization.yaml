# The same deployment the Helm chart produces by default: a namespace, a
# Deployment and a ClusterIP Service. Optional pieces live in ../components.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arith

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

# newTag is the release, the same version as Cargo.toml and Chart.yaml. To
# roll out a local build instead:
#   kubectl -n arith set image deployment/arith arith=ghcr.io/giovannirco/arith-rust:dev
images:
  - name: ghcr.io/giovannirco/arith-rust
    newTag: "1.2.0"
