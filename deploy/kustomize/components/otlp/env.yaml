- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OTEL_TRACES_EXPORTER
    value: otlp
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OTEL_LOGS_EXPORTER
    value: console,otlp
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector.monitoring.svc:4318
