apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arith
  labels:
    app.kubernetes.io/name: arith
spec:
  description: >-
    Ingress on 8000 from the cluster and from the nodes for probes. Egress to
    DNS only; add what the process needs to call.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: arith
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # kubelet's liveness and readiness probes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
