apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arith
  labels:
    app.kubernetes.io/name: arith
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arith
  policyTypes:
    - Ingress
  ingress:
    # Every pod in the cluster. Narrow it with a matchLabels on the namespace.
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8000
          protocol: TCP
