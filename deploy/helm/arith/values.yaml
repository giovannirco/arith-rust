# Defaults install a Deployment and a ClusterIP Service and nothing else, so
# the chart works on any cluster. Everything under "Optional pieces" is off.

replicaCount: 1

image:
  repository: ghcr.io/giovannirco/arith
  # Empty means the chart's appVersion. To roll out a build: --set image.tag=2
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  # The Service port. The container always listens on 8000.
  port: 8000

# Environment for the process. ARITH_* belong to the program; OTEL_* follow the
# OpenTelemetry specification. The full list is in the README.
env:
  ARITH_LOG_LEVEL: info
  ARITH_LOG_FORMAT: json
  # OTEL_TRACES_EXPORTER: otlp
  # OTEL_LOGS_EXPORTER: console,otlp
  # OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc:4318
# Entries in Kubernetes form, for valueFrom and friends.
extraEnv: []

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# Longer than ARITH_SHUTDOWN_TIMEOUT (10s), so draining finishes before the kill.
terminationGracePeriodSeconds: 20

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ---------------------------------------------------------------------------
# Optional pieces. Each one is a toggle; each one needs something the cluster
# may not have (an ingress controller, Gateway API, a CNI that enforces
# policy, Cilium, the Prometheus Operator CRDs).
# ---------------------------------------------------------------------------

# networking.k8s.io/v1 Ingress.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: arith.example.com
  path: /
  pathType: Prefix
  # - secretName: arith-tls
  #   hosts: [arith.example.com]
  tls: []

# gateway.networking.k8s.io/v1 HTTPRoute. Name the Gateway listeners to attach to.
httpRoute:
  enabled: false
  annotations: {}
  hostnames:
    - arith.example.com
  parentRefs: []
  # - name: gateway
  #   namespace: gateway-system
  #   sectionName: https

# networking.k8s.io/v1 NetworkPolicy. Only CNIs that enforce policy honour it.
networkPolicy:
  enabled: false
  # Who may reach port 8000, as NetworkPolicyPeer entries. The default is every
  # pod in the cluster and nothing from outside it. kubelet probes come from the
  # node and are let through by most CNIs regardless of this list.
  ingressFrom:
    - namespaceSelector: {}
  egress:
    # When true, egress is limited to DNS on port 53 plus the rules below.
    enabled: false
    # NetworkPolicyEgressRule entries, e.g. the OTLP collector.
    rules: []

# cilium.io/v2 CiliumNetworkPolicy, for clusters running Cilium. Default deny
# both ways, then the allowances below.
ciliumNetworkPolicy:
  enabled: false
  # Namespaces whose pods may call the API. Empty means every pod in the
  # cluster. Kubelet probes (host and remote-node) are always allowed.
  ingressFromNamespaces: []
  # Destinations the process may call, besides DNS to kube-dns (always allowed).
  egress: []
  # - namespace: monitoring
  #   podSelector:
  #     app.kubernetes.io/name: alloy
  #   ports: [4317, 4318]
  # Rules appended as written, for anything the fields above cannot express.
  extraIngress: []
  extraEgress: []

# monitoring.coreos.com/v1 ServiceMonitor for the Prometheus Operator and
# compatible collectors.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Labels the Prometheus instance selects on, e.g. release: kube-prometheus-stack
  labels: {}

# `helm test` runs a curl pod against the Service and checks the worked example.
tests:
  image: curlimages/curl:8.22.0
