apiVersion: v2
name: arith-rust
description: Integer arithmetic over HTTP. Four endpoints, a page, metrics, traces and logs.
type: application
# One version per release, the same as Cargo.toml: the chart's version, its
# appVersion (the image tag it installs by default) and the image below. A tag
# v<version> publishes them; CI checks they agree and never republishes one.
version: 1.2.0
appVersion: "1.2.0"
home: https://github.com/giovannirco/arith-rust
sources:
  - https://github.com/giovannirco/arith-rust
maintainers:
  - name: Giovanni Coutinho
    url: https://github.com/giovannirco
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/giovannirco/arith-rust
  artifacthub.io/images: |
    - name: arith
      image: ghcr.io/giovannirco/arith-rust:1.2.0
      platforms:
        - linux/amd64
        - linux/arm64
