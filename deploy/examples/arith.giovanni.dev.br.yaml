# The values behind https://arith.giovanni.dev.br, a cluster with Cilium, Envoy
# Gateway (Gateway API), Grafana's k8s-monitoring Alloy and the Prometheus
# Operator CRDs. Every optional piece of the chart is on here.
#
#   helm install arith deploy/helm/arith --namespace arith --create-namespace \
#     -f deploy/examples/arith.giovanni.dev.br.yaml --wait

env:
  ARITH_LOG_LEVEL: info
  ARITH_LOG_FORMAT: json
  # Traces and logs go to the cluster's Alloy, which fans out to Tempo and
  # Loki. console stays on so `kubectl logs` keeps working; Alloy also tails
  # stdout, so Loki holds each line twice, under different labels.
  OTEL_TRACES_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: console,otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://k8s-monitoring-alloy-receiver.monitoring.svc:4318

# Two Gateways, LAN and public, each with an http listener (redirects) and the
# https listener for *.giovanni.dev.br.
httpRoute:
  enabled: true
  hostnames:
    - arith.giovanni.dev.br
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
    - name: envoy-internal
      namespace: network
      sectionName: https-giovanni
    - name: envoy-external
      namespace: network
      sectionName: http
    - name: envoy-external
      namespace: network
      sectionName: https-giovanni

# Default deny. In: Envoy (network), Alloy's scrapes (monitoring), and the
# release namespace so `helm test` can run. Out: DNS and the OTLP receiver.
ciliumNetworkPolicy:
  enabled: true
  ingressFromNamespaces:
    - network
    - monitoring
    - arith
  egress:
    - namespace: monitoring
      podSelector:
        app.kubernetes.io/name: alloy-receiver
      ports: [4318]

# Alloy's prometheus-operator integration picks this up and ships to Mimir.
serviceMonitor:
  enabled: true
  interval: 30s
