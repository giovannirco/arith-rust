# Every push and pull request: format, lint, tests with coverage, chart and
# kustomize rendering, a helm install and helm test on kind, and an image build
# for both architectures.
# Pushes to master also publish the image as ghcr.io/giovannirco/arith:sha-<short>.
# A tag made of digits (git tag 2 && git push origin 2) publishes the image as
# :2 and :latest, and the chart to oci://ghcr.io/giovannirco/charts with that
# app version, plus the Artifact Hub repository metadata on the artifacthub.io
# tag. The chart job fails if Chart.yaml's version is already published.
name: ci

on:
  push:
    branches: [master]
    tags: ["[0-9]+"]
  pull_request:

permissions:
  contents: read

# One run per ref at a time, so two pushes to master never write two
# manifests at once. A newer push waits (GitHub keeps only the newest pending
# run); a running publish or tag release is never cancelled. Pull requests
# drop their superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/giovannirco/arith
  CHARTS: oci://ghcr.io/giovannirco/charts
  CHART_REPO: ghcr.io/giovannirco/charts/arith

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo '### Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: cargo llvm-cov report --html --output-dir coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage/

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The chart carries its own copy of the license; keep it identical.
      - run: cmp LICENSE deploy/helm/arith/LICENSE
      - run: helm lint deploy/helm/arith
      - run: helm lint deploy/helm/arith -f deploy/helm/arith/ci/all-on-values.yaml
      - run: helm template arith deploy/helm/arith -n arith > /dev/null
      - run: helm template arith deploy/helm/arith -n arith -f deploy/helm/arith/ci/all-on-values.yaml > /dev/null
      # --set image.tag=2 arrives as an integer; the image line must still read :2.
      # Quoted: a bare `image: ` in a YAML scalar is a mapping and GitHub
      # refuses the workflow file.
      - run: "helm template arith deploy/helm/arith -n arith --set image.tag=2 | grep -q 'image: \"ghcr.io/giovannirco/arith:2\"'"
      - run: kubectl kustomize deploy/kustomize/base > /dev/null
      - run: kubectl kustomize deploy/kustomize/overlays/example > /dev/null

  # Install the chart from this commit on a fresh kind cluster and run its
  # helm test, which curls /api/sub?term_one=4&term_two=1 through the Service
  # and expects {"result":3}. The image is the chart's default, from GHCR.
  smoke:
    needs: [manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
      - run: helm install arith deploy/helm/arith --namespace arith --create-namespace --wait --timeout 3m
      # No --logs: the hook deletes the test pod on success before Helm 3 reads
      # it. On failure the pod stays, and the next step prints it.
      - run: helm test arith --namespace arith
      - if: failure()
        run: |
          kubectl -n arith get all,events
          kubectl -n arith logs arith-test || true
          kubectl -n arith logs deployment/arith --tail 50

  image:
    needs: [test]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [image, manifests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${DOCKER_METADATA_OUTPUT_VERSION}"

  chart:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The chart has its own semver. A git tag changes the default image, so
      # it needs a new chart version too; never overwrite a published one.
      - name: Refuse a chart version that is already on GHCR
        shell: bash
        run: |
          version="$(yq .version deploy/helm/arith/Chart.yaml)"
          published="$(oras repo tags "$CHART_REPO")"
          if grep -qxF "$version" <<< "$published"; then
            echo "::error file=deploy/helm/arith/Chart.yaml::chart $version is already on GHCR; bump version in Chart.yaml"
            exit 1
          fi
      # Git keeps appVersion "1" so the README walkthrough (build 2, roll it
      # out) shows a rollout. The published chart defaults to the image it
      # ships with, and its Artifact Hub image annotation says the same.
      - name: Point appVersion and the image annotation at this tag
        shell: bash
        working-directory: deploy/helm/arith
        run: |
          yq -i ".appVersion = \"$GITHUB_REF_NAME\" |
                 .annotations[\"artifacthub.io/images\"] |= sub(\"arith:[0-9]+\", \"arith:$GITHUB_REF_NAME\")" Chart.yaml
          test "$(yq '.annotations["artifacthub.io/images"] | from_yaml | .[0].image' Chart.yaml)" = "$IMAGE:$GITHUB_REF_NAME"
      - run: helm package deploy/helm/arith --destination /tmp/chart
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - run: helm push /tmp/chart/arith-*.tgz "$CHARTS"
      # Artifact Hub reads the repository metadata (verified publisher, owners)
      # from this tag next to the chart, as its docs describe for OCI.
      - name: Push the Artifact Hub repository metadata
        working-directory: deploy/helm/arith
        run: |
          oras push "$CHART_REPO:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
